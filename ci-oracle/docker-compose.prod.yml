services:
  caddy:
    image: caddy:2-alpine
    container_name: rm-frotas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rm-frotas-net

  api:
    image: ghcr.io/raelmartinss/rm-frotas:${IMAGE_TAG:-latest}
    container_name: rm-frotas-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - rm-frotas-net

networks:
  rm-frotas-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
