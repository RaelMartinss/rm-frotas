name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  IMAGE_NAME: ghcr.io/raelmartinss/rm-frotas

jobs:
  lint:
    name: Run Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint

  test:
    name: Run Unit and E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply Prisma migrations to test database
        run: npx prisma migrate deploy
      - name: Run all tests
        run: npm run test:all

  deploy:
    name: Build ARM64 & Deploy on Oracle VM
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Package source code
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='dist' --warning=no-file-changed -czf /tmp/app.tar.gz .

      - name: Upload source and configs to Oracle VM
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh "$OCI_USER@$OCI_HOST" 'mkdir -p ~/rm-frotas'
          scp /tmp/app.tar.gz docker-compose.yml Caddyfile deploy.sh "$OCI_USER@$OCI_HOST:~/rm-frotas/"

      - name: Native ARM64 Build, Push to GHCR & Deploy
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$OCI_USER@$OCI_HOST" "IMAGE_TAG='$IMAGE_TAG' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash ~/rm-frotas/deploy.sh"

      - name: Verify Public Healthcheck (Post-Deploy)
        run: |
          echo "Verificando endpoint público após deploy..."
          for i in {1..10}; do
            if curl -sSf --max-time 10 https://rm-frotas.duckdns.org/v1/health | grep '"status":"ok"'; then
              echo "Deploy validado com sucesso via internet pública!"
              exit 0
            fi
            echo "Aguardando API responder publicamente... tentativa $i/10"
            sleep 6
          done
          echo "Falha ao validar healthcheck público pós-deploy" >&2
          exit 1

